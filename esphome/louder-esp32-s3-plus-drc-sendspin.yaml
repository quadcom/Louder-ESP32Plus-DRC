# ============================================================
# Louder-ESP32-S3-Plus - Sendspin media player + 3-band DRC
# ============================================================
# ESP32-S3 + TAS5825M, Sendspin for synchronised multi-room audio, Ethernet.
#
# SELF-CONTAINED AND PASTE-READY. The DAC + DRC block is inlined rather than
# pulled from packages/dac-tas58xx-drc.yaml, so this file can be pasted straight
# into the ESPHome Device Builder code window with nothing copied alongside it.
# A config pasted there cannot `!include` a local file.
#
# ---- What this changes from the stock Sonocotta config ----
#
# 1. firmware/esphome/packages/dac-tas58xx.yaml is REMOVED from the remote
#    package list and replaced by the inline DAC + DRC configuration below.
#    Everything else - sendspin, audio, light, monitoring, ethernet - still
#    comes from the Sonocotta repo, untouched.
#
# 2. The tas58xx component comes from quadcom/Louder-ESP32Plus-DRC, a fork of
#    mrtoy-me/esphome-tas58xx with the DRC added. ESPHome fetches it; nothing
#    needs copying anywhere.
#
# 3. The DAC substitutions are spelled out with real values, because the inline
#    block reads them directly rather than relying on the defaults that used to
#    live inside the removed remote package.
#
# 4. Added: 15 DRC numbers, a DRC master switch, a read-only register-dump
#    button, a reset-to-defaults button and one diagnostic override. Ratio
#    defaults to 1:1 - a unity gain curve - so the DRC does nothing until asked.
#
# ---- BEFORE FLASHING ----
#
#   1. Put real credentials in secrets.yaml (see secrets.yaml.example).
#   2. Set `name` and `friendly_name` below. If you are reflashing a board that
#      is already in Home Assistant, keep its existing `name` so it keeps its
#      entity history.
#   3. Set `tas58xx_analog_gain` for YOUR supply voltage - see the note on it
#      below. This is the one setting that can damage nothing but sound wrong,
#      or clip hard, if left at someone else's value.
#
# ---- Sizing analog gain to your PSU and speakers ----
#
# tas58xx_analog_gain is the hard ceiling on output power, and the right place
# to limit it: unlike digital volume, nobody can turn it up from Home Assistant.
#
# 0dBFS corresponds to 29.5V peak at 0db of analog gain, so on any supply below
# about 30V the output would hit the rail and hard clip before reaching full
# scale. That is exactly what this register exists to prevent. Pick the row at
# or just below your rail voltage:
#
#   0db   = 29.50V    -1db = 26.42V    -2db   = 23.65V    -3db   = 21.17V
#   -3.5db = 20.02V   -4db = 18.94V    -4.5db = 17.91V    -5db   = 16.94V
#   -6db  = 15.15V    -8db = 12.13V    -10db  =  9.75V    -12db  =  7.87V
#
# Setting it BELOW your rail is explicitly safe - it discards headroom and
# reduces the digital distortion you get from running digital volume low.
# Setting it above the rail is what clips.
#
# To check it against the speakers rather than the supply, a speaker of RMS
# power P and impedance R needs
#     peak volts = sqrt(2 * P * R)
# to reach its rating. If that exceeds what your rail can deliver, the amplifier
# is the binding limit and there is no reason to reduce analog gain further.
#
# ---- 1SPW vs BD modulation ----
#
# 1SPW rails one output to ground for most of the audio cycle so only one side
# switches, cutting switching losses at a slight THD penalty. Sonocotta's
# guidance is 1SPW above 15V; their measurement on this hardware at 26V was 68%
# efficient on BD against 78% on 1SPW - delivering 25.7W, BD draws 38.0W against
# 1SPW's 32.8W, so BD turns about 73% more power into heat. BD wins on THD at
# 12V and below. Only BD_MODE and 1SPW_MODE validate; the _MODE suffix matters.
#
# ---- READ THIS BEFORE TOUCHING drc_bands ----
#
# "1" is a single full-range compressor: the crossover biquads stay at their
# pass-through reset defaults, DRC bands 2/3 stay muted, and only the drc_low_*
# controls do anything. That is the default and it is what has hardware behind
# it - every one-band coefficient was confirmed by register readback.
#
# "3" programs the crossover and sums all three bands, making all fifteen
# controls live. Also verified by readback: at 300Hz/3000Hz all forty crossover
# coefficient words read back exactly as designed, including the two writes that
# straddle a page boundary.
#
# After switching, press "DRC Register Dump" and confirm the eight crossover
# addresses report "= programmed" rather than a 0x08000000 pass-through. Do that
# before playing anything loud: the bands are summed, so overlapping corners
# raise the level - up to about +9.5dB if all three pass the same content. The
# amp's DC-offset, overcurrent and thermal protections guard the amp, not a
# loudspeaker. First three-band test: low volume, speakers you can afford.
#
# Pick crossover corners clear of your drivers' roll-offs.
#
# See https://github.com/quadcom/Louder-ESP32Plus-DRC
# ============================================================

substitutions:
  name: louder-esp32-s3-plus-drc
  friendly_name: Speaker
  task_stack_in_psram: "true"

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # TAS5825M - I2C address 0x4C, set by the component from this variant.
  # The Louder-ESP32-Plus and -Pro carry the TAS5825M. The plain Louder-ESP32
  # and the Mini carry a TAS5805M instead and need the sibling config
  # louder-esp32-s3-drc-sendspin.yaml - the DSP memory maps are incompatible.
  tas58xx_variant: TAS5825M
  tas58xx_enable_pin: GPIO17
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

  # ===== DAC settings =====
  tas58xx_dac_mode: BTL          # BTL stereo, or PBTL mono at double power
                                 # (PBTL requires mixer_mode MONO / LEFT / RIGHT)
  tas58xx_modulation: 1SPW_MODE  # or BD_MODE - see the header
  tas58xx_mixer_mode: STEREO     # STEREO, STEREO_INVERSE, MONO, LEFT, RIGHT

  # SET THIS FOR YOUR SUPPLY. See the sizing table in the header.
  # -4db = 18.94V peak, a conservative default that is safe on any rail of 19V
  # or more and merely leaves headroom unused on a higher one.
  tas58xx_analog_gain: -4db

  # Nominal speaker impedance. Nothing is written to the amplifier - this only
  # scales the Maximum Output Power sensor, which is measured PVDD turned into
  # watts. Set it to your speakers or that figure is fiction.
  tas58xx_load_impedance: "8"

  tas58xx_volume_max: 0dB
  tas58xx_volume_min: -50dB
  tas58xx_refresh_eq: AUTO

  # Boot state of the Enable DAC switch, nothing more - it does NOT keep the DAC
  # awake while idle. Idle shutdown comes from sendspin-addon-dac-enable.yaml,
  # whose on_idle turns the switch off, same as any stock Sonocotta build.
  #
  # Keep ALWAYS_ON: it guarantees the DAC is in PLAY when the silent boot FLAC
  # runs, which is what lets the DSP lock the I2S clock and accept the EQ and DRC
  # coefficients. ALWAYS_OFF would race that sequence.
  #
  # "Off" is the DEEP_SLEEP control state, not a power-down - the PDN pin is only
  # pulsed once at boot. That matters: the amp has no non-volatile coefficient
  # storage, and the setup state machine runs once then disables its loop, so if
  # idle shutdown reset the DSP the DRC and EQ would be lost on the first idle
  # period and never restored. Deep sleep retains DSP RAM, so they survive.
  tas58xx_dac_restore_mode: ALWAYS_ON

  # ===== DRC =====
  tas58xx_drc_branch: main       # branch/tag of the component fork to build
  tas58xx_drc_bands: "1"         # see the header before changing to "3"
  tas58xx_drc_crossover_low: 300Hz
  tas58xx_drc_crossover_high: 3000Hz
  tas58xx_drc_energy: 2ms
  tas58xx_drc_dsp_rate: "96000"  # DSP internal rate, not the I2S rate
  tas58xx_drc_restore_mode: RESTORE_DEFAULT_OFF

  # RGB LED
  rgb_led_pin: GPIO21

  # IR receiver
  ir_rx_pin: GPIO07

  # SPI pins (for display)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13

  # Display control pins
  display_cs_pin: GPIO47
  display_dc_pin: GPIO38
  display_reset_pin: GPIO48

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  # DO NOT ADD on_boot HERE. sendspin-addon-tas58xx.yaml already defines one, to
  # play the silent startup FLAC that gives the DSP its I2S clock lock - without
  # which no EQ or DRC coefficient is ever accepted. ESPHome's package merge
  # REPLACES a dict with a list rather than appending, so an on_boot in this file
  # deletes the package's one. It validates cleanly and the amp goes quiet on
  # every DSP setting, with nothing in the log to say why.

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in
      # progress without needing to be placed in IRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

# The DRC coefficient writes log at DEBUG. The register dump logs at INFO, so it
# works either way, but keep debug while commissioning the DRC.
logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: false

# ===== TAS5825M DAC with 3-band DRC =====
# Inlined in place of the remote dac-tas58xx.yaml so this file needs nothing
# copied alongside it. Exports the same ids the other Sonocotta packages bind to
# (external_dac, enable_dac, over_temperature_warning, tas58xx_eq_mode_select).

# ===== Input level metering =====
# The TAS5825M cannot report level - see the sensor block below. This inserts a
# measuring pass-through into the speaker chain the audio.yaml package builds,
# turning mixer -> i2s into mixer -> meter -> i2s. Every byte and every lifecycle
# call is forwarded untouched; volume still reaches the DAC through it.
#
# WHAT IT MEASURES: the amplifier's digital INPUT. Not its output. Digital volume,
# EQ, the DRC and thermal foldback all happen after this point inside the chip and
# none of them are observable. A reading of -20 dBFS here says the stream is 20 dB
# below full scale, not that the speakers are 20 dB down.
#
# Done with !extend rather than by inlining audio.yaml so the upstream package
# stays in the remote list and keeps tracking upstream.
speaker:
  - platform: audio_level
    id: level_meter
    output_speaker: i2s_speaker_id
    update_interval: 500ms
    # Stated rather than inherited from i2s_speaker_id. The mixer above validates
    # its output speaker's format, and that happens before the meter's own
    # inheritance runs, so leaving these out fails the build. Match audio.yaml.
    sample_rate: 48000
    num_channels: 2
    bits_per_sample: 16
    # Each reading covers the window that just closed - a windowed RMS and a true
    # window peak, not a decaying meter.
    left_rms:
      name: Level Left RMS
    right_rms:
      name: Level Right RMS
    left_peak:
      name: Level Left Peak
    right_peak:
      name: Level Right Peak

  # Redirect the mixer's output through the meter.
  - id: !extend mixer_speaker_id
    output_speaker: level_meter

external_components:
  - source: github://quadcom/Louder-ESP32Plus-DRC@${tas58xx_drc_branch}
    components: [tas58xx, audio_level]
    # 0s = re-fetch on every build. With a cache window, a push can take that
    # long to reach the device and you end up debugging code you are not
    # running. Costs one git fetch per build. Pin tas58xx_drc_branch to a commit
    # SHA if you want reproducible builds instead.
    refresh: 0s

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 400kHz
  scan: true

audio_dac:
  - platform: tas58xx
    id: external_dac
    tas58xx_dac: ${tas58xx_variant}
    enable_pin: ${tas58xx_enable_pin}
    modulation: ${tas58xx_modulation}
    dac_mode: ${tas58xx_dac_mode}
    mixer_mode: ${tas58xx_mixer_mode}
    analog_gain: ${tas58xx_analog_gain}
    load_impedance: ${tas58xx_load_impedance}
    volume_max: ${tas58xx_volume_max}
    volume_min: ${tas58xx_volume_min}
    refresh_eq: ${tas58xx_refresh_eq}
    update_interval: 5s

    # DRC topology. Read the header warning before changing drc_bands to 3.
    drc_bands: ${tas58xx_drc_bands}
    drc_crossover_low: ${tas58xx_drc_crossover_low}
    drc_crossover_high: ${tas58xx_drc_crossover_high}
    drc_energy: ${tas58xx_drc_energy}
    # Process Flow 1 upconverts to 88.2/96 kHz. This is that internal rate, not
    # the I2S rate; the wrong value skews attack and release by up to 8.8%.
    drc_dsp_rate: ${tas58xx_drc_dsp_rate}

switch:
  - platform: tas58xx
    enable_dac:
      name: Enable DAC
      id: enable_dac
      restore_mode: ${tas58xx_dac_restore_mode}

    # Master DRC enable. Off zeroes every slope and offset, so the DRC is a
    # no-op. Required whenever any drc_* number is configured.
    enable_drc:
      name: DRC
      id: enable_drc
      restore_mode: ${tas58xx_drc_restore_mode}

select:
  - platform: tas58xx
    mixer_mode:
      name: _Mixer Mode
    eq_mode:
      name: EQ Mode
      id: tas58xx_eq_mode_select

number:
  - platform: tas58xx
    channel_volume_left:
      name: _Volume Left
    channel_volume_right:
      name: _Volume Right

    # ---- DRC low band ----
    # With drc_bands: 1 this is the full-range compressor. A reasonable starting
    # point is threshold -20dB, ratio 4, makeup 6dB. Bring makeup up last, and
    # watch the over-current binary sensors as you do.
    drc_low_threshold:
      name: DRC Low Threshold
    drc_low_ratio:
      name: DRC Low Ratio
    drc_low_attack:
      name: DRC Low Attack
    drc_low_release:
      name: DRC Low Release
    drc_low_makeup:
      name: DRC Low Makeup

    # ---- DRC mid band ----  (inert unless drc_bands: 3)
    drc_mid_threshold:
      name: DRC Mid Threshold
    drc_mid_ratio:
      name: DRC Mid Ratio
    drc_mid_attack:
      name: DRC Mid Attack
    drc_mid_release:
      name: DRC Mid Release
    drc_mid_makeup:
      name: DRC Mid Makeup

    # ---- DRC high band ---- (inert unless drc_bands: 3)
    drc_high_threshold:
      name: DRC High Threshold
    drc_high_ratio:
      name: DRC High Ratio
    drc_high_attack:
      name: DRC High Attack
    drc_high_release:
      name: DRC High Release
    drc_high_makeup:
      name: DRC High Makeup

    # 15-band EQ, ganged. Left channel drives both when EQ is ganged.
    left_eq_gain_20Hz:
      name: Left ---20Hz
    left_eq_gain_31.5Hz:
      name: Left ---31.5Hz
    left_eq_gain_50Hz:
      name: Left ---50Hz
    left_eq_gain_80Hz:
      name: Left ---80Hz
    left_eq_gain_125Hz:
      name: Left --125Hz
    left_eq_gain_200Hz:
      name: Left --200Hz
    left_eq_gain_315Hz:
      name: Left --315Hz
    left_eq_gain_500Hz:
      name: Left --500Hz
    left_eq_gain_800Hz:
      name: Left --800Hz
    left_eq_gain_1250Hz:
      name: Left -1250Hz
    left_eq_gain_2000Hz:
      name: Left -2000Hz
    left_eq_gain_3150Hz:
      name: Left -3150Hz
    left_eq_gain_5000Hz:
      name: Left -5000Hz
    left_eq_gain_8000Hz:
      name: Left -8000Hz
    left_eq_gain_16000Hz:
      name: Left 16000Hz

  # Writes a raw value straight to every band's region 2 offset register,
  # bypassing the derived off2 = -k*T1.
  #
  # DIAGNOSTIC. Leave it at +1 - the maximum, meaning "derived" - for normal use.
  #
  # It exists because the two normal controls cannot vary the offset
  # independently: off2 = -k*T1, so asking for a small offset forces a high knee,
  # and there is then no material above the knee left to measure. Pinning the
  # offset register's units down took three runs because of that coupling. See
  # the units note in components/tas58xx/tas58xx_drc.h.
  #
  # restore_value is deliberately false. An override lasts until the next reboot
  # and no longer, so forgetting it leaves a device that comes back with the
  # derived offset rather than one quietly holding a stale diagnostic value.
  - platform: template
    name: DRC Offset 2 Override
    id: drc_offset2_override
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_value: 1.0
    min_value: -40.0
    max_value: 1.0
    step: 0.25
    mode: box
    on_value:
      - lambda: id(external_dac)->set_drc_offset2_override(x);

sensor:
  - platform: tas58xx
    update_interval: 10s
    faults_cleared:
      name: "Times Faults Cleared"

    # ---- Amplifier telemetry ----
    # This is all of it. The TAS5825M has no level meter of any kind, no readback
    # of the attenuation its DRC or thermal foldback is applying, and no current,
    # power or load measurement. The PVDD ADC is its one analog reading.
    #
    # Measured supply voltage. Unavailable unless the amp is in play - the PVDD
    # ADC reads zero otherwise, and 0V would look like a dead supply.
    pvdd_voltage:
      name: PVDD Voltage
    # Per channel into load_impedance above, sized from whichever of the measured
    # rail and the analog gain ceiling binds first.
    max_output_power:
      name: Maximum Output Power
    # Rail margin against tas58xx_analog_gain. NEGATIVE means the analog gain is
    # set higher than the supply can deliver, so full scale material clips on the
    # rail - the exact mistake the analog gain table above warns about, now
    # checked against the real supply instead of a guess at it.
    clip_headroom:
      name: Clip Headroom
    # 0-4 = below warning / 112 / 122 / 134 / 146 degC. Anything above 0 means
    # thermal foldback is already attenuating the output.
    over_temp_warning_level:
      name: Over Temperature Warning Level
    # What the DAC detects on its own input, not what was configured. 0 = FS error.
    sample_rate:
      name: Detected Sample Rate

# Reported power state: Deep Sleep, Sleep, Hi-Z or Play.
text_sensor:
  - platform: template
    name: Amplifier State
    entity_category: diagnostic
    update_interval: 10s
    lambda: return {id(external_dac)->power_state_name()};

binary_sensor:
  - platform: tas58xx
    have_fault:
      name: Any Faults
      exclude: CLOCK_FAULT
    left_channel_dc_fault:
      name: Left Channel DC Fault
    right_channel_dc_fault:
      name: Right Channel DC Fault
    left_channel_over_current:
      name: Left Channel Over Current
    right_channel_over_current:
      name: Right Channel Over Current
    otp_crc_check:
      name: CRC Check Fault
    bq_write_failed:
      name: BQ Write Failure
    pcdd_over_voltage:
      name: PCDD Over Voltage
    pcdd_under_voltage:
      name: PCDD Under Voltage
    over_temp_shutdown:
      name: Over Temperature Shutdown Fault
    over_temp_warning:
      name: Over Temperature Warning
      id: over_temperature_warning

    # Cycle by cycle current limiting engaged - the amp clamped a peak and carried
    # on. The closest this part gets to reporting that the load is asking for more
    # current than it can deliver.
    left_channel_over_current_warning:
      name: Left Channel Over Current Warning
    right_channel_over_current_warning:
      name: Right Channel Over Current Warning

    # Auto mute state, inverted. "Something is playing", not a level.
    left_channel_signal:
      name: Left Channel Signal
    right_channel_signal:
      name: Right Channel Signal

# Dumps the live DRC block to the log, then sweeps the crossover region and
# reports every location shaped like a resting pass-through biquad.
#
# READ-ONLY - it writes nothing, so it is safe to press at any time. Press it
# before enabling the DRC and before ever setting drc_bands: 3.
#
# It runs ~90 I2C reads synchronously, a few tens of milliseconds of blocked
# loop. Harmless while idle; don't press it mid-playback or you may get an
# audio glitch and a spurious clock fault.
button:
  - platform: template
    name: DRC Register Dump
    entity_category: diagnostic
    on_press:
      - lambda: id(external_dac)->log_drc_registers();

  # Puts all fifteen controls back to their compiled-in defaults: ratio 1:1,
  # makeup 0dB, and the documented threshold and time constants. Ratio 1:1 is a
  # unity gain curve, so the DRC ends up inert regardless of the DRC switch -
  # the switch is left alone deliberately, it is yours to control.
  #
  # The new values are published to Home Assistant, written to the DSP and
  # saved, so a reboot will not bring the old ones back.
  - platform: template
    name: DRC Reset Defaults
    entity_category: config
    on_press:
      - lambda: id(external_dac)->reset_drc_to_defaults();

# ===== Separating the DRC bands in the UI =====
# Not done here, deliberately. A Home Assistant device page is generated from
# the entity list and has no divider primitive, so any "spacer" has to be a real
# entity - it renders as a greyed-out read-only row, which reads worse than no
# separator at all.
#
# Real labelled lines come from a dashboard card instead. Paste-ready YAML is in
# docs/ha-dashboard-drc.yaml: an entities card using 'type: section' rows, each
# of which draws an actual horizontal rule with a heading above its band.

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      # dac-tas58xx.yaml is deliberately NOT here - replaced by the inline
      # DAC + DRC configuration above. The biamp and presets variants are
      # incompatible for the same reason: they would declare a second audio_dac.
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin.yaml
      # Optional: OLED displays clock when idling, and track/artist info when playing
      # - firmware/esphome/packages/sendspin-addon-oled.yaml
      - firmware/esphome/packages/sendspin-audio-addon-external-dac.yaml
      - firmware/esphome/packages/sendspin-addon-dac-enable.yaml
      - firmware/esphome/packages/sendspin-addon-tas58xx.yaml

      - firmware/esphome/packages/light.yaml
      # - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      # - firmware/esphome/packages/monitoring-wifi.yaml
      # Ethernet. If you use WiFi instead, drop this and add a wifi: block -
      # and note the OLED package needs excluding here to free up the SPI bus.
      - firmware/esphome/packages/ethernet-w5500.yaml
